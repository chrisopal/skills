    <text x="88" y="304" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">诊断结论</text>
    <text x="88" y="360" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="bold" fill="#0097BA">01</text>
    <text x="136" y="358" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#111111">问题集中在流程断点</text>
    <text x="88" y="404" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4B5563">跨部门协同、数据一致性、现场响应</text>
    <text x="88" y="432" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4B5563">是影响交付质量的核心约束。</text>
    <rect x="468" y="276" width="344" height="226" rx="4" fill="#FFFFFF" stroke="#D0CECE" stroke-width="1"/>
    <rect x="468" y="276" width="344" height="44" fill="#0097BA"/>
    <text x="492" y="304" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">战略选择</text>
    <text x="492" y="360" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="bold" fill="#0097BA">02</text>
    <text x="540" y="358" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#111111">平台化优先于点状优化</text>
    <text x="492" y="404" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4B5563">以统一数据底座和标准能力组件</text>
    <text x="492" y="432" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4B5563">支撑后续场景快速复制。</text>
    <rect x="872" y="276" width="344" height="226" rx="4" fill="#FFFFFF" stroke="#D0CECE" stroke-width="1"/>
    <rect x="872" y="276" width="344" height="44" fill="#0097BA"/>
    <text x="896" y="304" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF">行动建议</text>
    <text x="896" y="360" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="34" font-weight="bold" fill="#0097BA">03</text>
    <text x="944" y="358" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold" fill="#111111">先试点再规模化推广</text>
    <text x="896" y="404" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4B5563">选择高价值、低阻力场景启动，</text>
    <text x="896" y="432" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="16" fill="#4B5563">形成方法论与组织牵引。</text>
