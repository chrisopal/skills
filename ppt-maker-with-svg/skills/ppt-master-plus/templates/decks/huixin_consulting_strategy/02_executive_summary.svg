  <text x="92" y="204" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold" fill="#111111">{{KEY_MESSAGE}}</text>
  <g id="summary-cards">
    <rect x="64" y="276" width="344" height="226" rx="4" fill="#FFFFFF" stroke="#D0CECE" stroke-width="1"/>
