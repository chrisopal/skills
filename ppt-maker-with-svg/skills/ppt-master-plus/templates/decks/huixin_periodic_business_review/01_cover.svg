<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-pptx-master="huixin-periodic-master" data-pptx-master-name="慧新月度季度汇报" data-pptx-layout="periodic-blank" data-pptx-layout-name="慧新月度季度通用页" data-pptx-page-role="cover">
<g id="cover-background" data-pptx-bounds="0 0 1280 720">
  <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/>
  <image href="images/huixin_light_cover_mosaic.png" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
</g>
<g id="cover-identity" data-pptx-bounds="42 36 260 36">
  <image href="images/huixin_logo_light.png" x="42" y="36" width="190" height="30" preserveAspectRatio="xMinYMin meet"/>
</g>
<g id="cover-title" data-pptx-bounds="48 220 520 330">
  <text x="48" y="252" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#0097BA" text-anchor="start">{{PERIOD_TYPE}}</text>
  <text x="48" y="322" font-family="Microsoft YaHei, Arial, sans-serif" font-size="48" font-weight="700" fill="#111111" text-anchor="start">{{TITLE}}</text>
  <text x="48" y="368" font-family="Microsoft YaHei, Arial, sans-serif" font-size="21" font-weight="400" fill="#4B5563" text-anchor="start">{{SUBTITLE}}</text>
  <rect x="48" y="400" width="118" height="5" fill="#0097BA" rx="2"/>
  <rect x="166" y="400" width="52" height="5" fill="#A4D968" rx="2"/>
  <text x="48" y="452" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">复盘周期：{{REPORT_PERIOD}}</text>
  <text x="48" y="482" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="400" fill="#4B5563" text-anchor="start">规划周期：{{NEXT_PERIOD}}</text>
  <text x="48" y="530" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="700" fill="#111111" text-anchor="start">{{ORGANIZATION}}</text>
</g>
<g id="cover-meta" data-pptx-bounds="48 622 520 56">
  <text x="48" y="646" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">数据口径：{{DATA_CUTOFF}}</text>
  <text x="48" y="674" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" font-weight="400" fill="#4B5563" text-anchor="start">{{PRESENTER}}  |  {{DATE}}</text>
</g>
