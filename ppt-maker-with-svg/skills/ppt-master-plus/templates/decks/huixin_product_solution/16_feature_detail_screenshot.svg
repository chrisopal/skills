    <polygon points="158,282 184,282 204,322 178,322" fill="#83C410"/>
    <polygon points="196,282 222,282 242,322 216,322" fill="#0097BA"/>
    <rect x="800" y="216" width="408" height="392" rx="18" fill="#FFFFFF" stroke="#D0CECE"/>
    <text x="834" y="264" fill="#111111" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="700">{{FEATURE_NAME}}</text>
    <text x="834" y="304" fill="#4B5563" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="15">{{FEATURE_DESC}}</text>
    <rect x="834" y="348" width="328" height="56" rx="12" fill="#0097BA" fill-opacity="0.12"/>
    <text x="858" y="382" fill="#111111" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700">{{HIGHLIGHT_1}}</text>
    <rect x="834" y="424" width="328" height="56" rx="12" fill="#83C410" fill-opacity="0.24"/>
    <text x="858" y="458" fill="#111111" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700">{{HIGHLIGHT_2}}</text>
    <rect x="834" y="500" width="328" height="56" rx="12" fill="#F5F6F7"/>
    <text x="858" y="534" fill="#111111" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="700">{{HIGHLIGHT_3}}</text>
