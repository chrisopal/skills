  <text x="72" y="124" fill="#111111" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="38" font-weight="700">{{PAGE_TITLE}}</text>
  <text x="72" y="162" fill="#4B5563" font-family="MiSans, Microsoft YaHei, Arial, sans-serif" font-size="18">{{KEY_MESSAGE}}</text>
  <g id="feature-detail">
