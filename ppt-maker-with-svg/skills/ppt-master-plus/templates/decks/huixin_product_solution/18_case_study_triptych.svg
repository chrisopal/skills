    <text x="900" y="494" fill="#A4D968" font-family="Microsoft YaHei, Arial, sans-serif" font-size="42" font-weight="700">{{VALUE_KPI_2}}</text>
    <text x="900" y="532" fill="#D9D9D9" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">{{VALUE_KPI_2_DESC}}</text>
    <polygon points="1068,558 1098,558 1126,606 1096,606" fill="#D9D9D9" fill-opacity="0.55"/>
