    <text x="504" y="336" fill="#111111" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="700">{{SOLUTION_TITLE}}</text>
    <text x="504" y="376" fill="#4B5563" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15"><tspan x="504" dy="0">{{SOLUTION_1}}</tspan><tspan x="504" dy="30">{{SOLUTION_2}}</tspan><tspan x="504" dy="30">{{SOLUTION_3}}</tspan></text>
    <rect x="506" y="500" width="268" height="88" rx="8" fill="#FFFFFF" stroke="#D9D9D9" stroke-dasharray="8,6"/>
