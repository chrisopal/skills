    <text x="94" y="454">{{TIME_3}}</text><text x="272" y="454">{{AGENDA_TOPIC_3}}</text><text x="672" y="454">{{AGENDA_MODE_3}}</text><text x="952" y="454">{{AGENDA_OUTPUT_3}}</text>
    <text x="94" y="514">{{TIME_4}}</text><text x="272" y="514">{{AGENDA_TOPIC_4}}</text><text x="672" y="514">{{AGENDA_MODE_4}}</text><text x="952" y="514">{{AGENDA_OUTPUT_4}}</text>
