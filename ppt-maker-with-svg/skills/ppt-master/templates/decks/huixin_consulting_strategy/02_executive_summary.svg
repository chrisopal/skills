    <text x="136" y="358" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B2F3A">问题集中在流程断点</text>
    <text x="88" y="404" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#4B5563">跨部门协同、数据一致性、现场响应</text>
    <text x="88" y="432" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="16" fill="#4B5563">是影响交付质量的核心约束。</text>
    <rect x="468" y="276" width="344" height="226" rx="4" fill="#FFFFFF" stroke="#D1D3D3" stroke-width="1"/>
