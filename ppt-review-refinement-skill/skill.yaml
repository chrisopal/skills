name: ppt-review-refinement
version: 1.1.0
display_name: PPT评审与精修
entrypoint: SKILL.md
language: zh-CN
capabilities:
  - pptx-structure-audit
  - slide-rendering
  - narrative-review
  - visual-review
  - change-approval
  - design-token-generation
  - safe-normalization
  - controlled-l2-l3-execution
  - review-report-composition
  - content-protection-validation
  - human-visual-signoff
  - image-policy-review
supported_inputs:
  - .pptx
unsupported_or_conservative:
  - .ppt
  - .pptm
  - VBA
  - ActiveX
  - embedded-objects
  - complex-SmartArt
runtime:
  python: ">=3.10"
  optional_system_tools:
    - libreoffice-or-soffice
    - pdftocairo-or-pdftoppm
license: MIT
