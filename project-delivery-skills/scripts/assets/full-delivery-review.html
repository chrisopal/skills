<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>@@PROJECT@@ 交付审核 模拟演练</title>
<style>
:root{--canvas:#F5F7FA;--surface:#FFFFFF;--muted:#F5F7FA;--text:#0B1220;--secondary:#526075;--border:#D9DEE7;--control:#68758A;--action:#0966D9;--solid:#0966D9;--solid-hover:#0754B5;--selected:#EDF4FF;--on-action:#FFFFFF;--brand:#1677FF}
html[data-theme=dark]{--canvas:#101722;--surface:#182230;--muted:#1D2939;--text:#EDF2F9;--secondary:#B8C5D8;--border:#35445A;--control:#9AAAC0;--action:#80B5FF;--solid:#1558B0;--solid-hover:#1A65C8;--selected:#1B304D}
body{margin:0;background:var(--canvas);color:var(--text);font:14px/1.7 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}.sidebar{background:var(--surface);border-right:1px solid var(--border);padding:24px 16px;position:sticky;top:0;height:calc(100vh - 48px)}.brand{font-size:16px;font-weight:600;margin:0 0 24px}.sidebar a{display:block;padding:8px 12px;color:var(--secondary);text-decoration:none;border-left:2px solid transparent}.sidebar a.active{background:var(--selected);color:var(--action);border-left-color:var(--brand)}
.main{min-width:0;padding:24px 32px}.topline{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}h1{font-size:24px;font-weight:600;margin:0 0 8px;line-height:1.5}h2{font-size:20px;font-weight:600;margin:0 0 24px}h3{font-size:16px;font-weight:600;margin:24px 0 12px}h4{font-size:14px;margin:16px 0 8px;font-weight:600}p{margin:8px 0 16px;overflow-wrap:anywhere}.meta{color:var(--secondary);margin:0}.tag{font-size:12px;display:inline-block;border:1px solid var(--border);border-radius:3px;padding:0 6px;color:var(--secondary);vertical-align:middle;font-weight:400}
.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:24px 0}.toolbar label{font-size:13px}.search{height:34px;box-sizing:border-box;width:260px;max-width:100%;border:1px solid var(--control);border-radius:4px;background:var(--surface);color:var(--text);font:inherit;padding:4px 8px}.button{display:inline-flex;align-items:center;justify-content:center;min-height:34px;box-sizing:border-box;padding:4px 12px;border:1px solid transparent;border-radius:4px;background:var(--solid);color:var(--on-action);font:inherit;text-decoration:none;cursor:pointer}.button:hover{background:var(--solid-hover)}.button.secondary{border-color:var(--control);background:var(--surface);color:var(--action)}.button.secondary:hover{background:var(--selected)}a{color:var(--action)}a:focus-visible,.button:focus-visible,.search:focus-visible,summary:focus-visible,.table-scroll:focus-visible{outline:2px solid var(--action);outline-offset:3px}
.page-section{scroll-margin-top:24px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:24px;margin:0 0 24px;min-width:0}.record{padding-bottom:24px;border-bottom:1px solid var(--border);min-width:0}.record:last-of-type{border-bottom:0;padding-bottom:0}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--border);border-radius:4px}.metrics>div{padding:16px;border-right:1px solid var(--border)}.metrics>div:last-child{border-right:0}.metrics span{color:var(--secondary);display:block}.metrics strong{display:block;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}.table-scroll{overflow-x:auto;max-width:100%;margin:12px 0}table{border-collapse:collapse;width:100%;min-width:620px;table-layout:fixed}th,td{padding:10px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--border);overflow-wrap:anywhere}th{font-size:12px;color:var(--secondary);background:var(--muted);font-weight:600}td{line-height:1.8}th:first-child,td:first-child{width:22%}details{margin:16px 0;background:var(--muted);border:1px solid var(--border);border-radius:4px;padding:12px 16px}summary{cursor:pointer;color:var(--action)}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;line-height:1.7}code{overflow-wrap:anywhere;font-size:12px}.filter-empty,.empty-static{color:var(--secondary);padding:16px;background:var(--muted)}[hidden]{display:none!important}.skip-link{position:absolute;left:16px;top:-60px;z-index:5;background:var(--surface);padding:8px}.skip-link:focus{top:8px}
@media(max-width:1024px){.shell{grid-template-columns:184px minmax(0,1fr)}.main{padding:24px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.metrics>div:nth-child(2){border-right:0}.metrics>div:nth-child(-n+2){border-bottom:1px solid var(--border)}}
@media(max-width:767px){.shell{display:block}.sidebar{position:static;height:auto;padding:16px;border-right:0;border-bottom:1px solid var(--border)}.brand{margin-bottom:12px}.sidebar nav{display:flex;flex-wrap:wrap;gap:4px}.sidebar a{padding:6px 8px}.main{padding:16px}.page-section{padding:16px}.topline{display:block}.topline .button{margin-top:12px}h1{font-size:22px}.search{width:100%}.toolbar label{width:100%}.toolbar .search{flex:1;min-width:150px}.metrics>div{padding:12px}}
</style>
</head>
<body>
<a class="skip-link" href="#main">跳到审核内容</a>
<div class="shell"><aside class="sidebar"><p class="brand">项目交付审核</p><nav aria-label="交付审核导航">@@NAV@@</nav></aside>
<main id="main" class="main"><header class="topline"><div><h1>设备维保工单平台与 ERP 集成</h1><p class="meta">@@PROJECT@@ <span class="tag">模拟演练</span> <span class="tag">内部审核</span></p><p class="meta">本地工程验证和模拟确认；未执行生产上线或真实客户验收。</p></div><button id="theme" class="button secondary" type="button" aria-pressed="false">切换深色</button></header>
<div class="toolbar"><label for="search">筛选登记内容</label><input id="search" class="search" type="search" placeholder="需求编号、工作包、负责人" autocomplete="off"><button id="clear" class="button secondary" type="button">清除</button><a class="button" download href="delivery-tracking.xlsx">下载项目台账</a><a class="button secondary" download href="manifest.json">成果版本清单</a></div>
@@FINAL_AUDIT@@
<p id="search-status" class="meta" role="status" aria-live="polite"></p>
@@SECTIONS@@
</main></div>
<script>
(()=>{'use strict';const root=document.documentElement,theme=document.getElementById('theme'),search=document.getElementById('search');
function setTheme(value){root.dataset.theme=value;theme.setAttribute('aria-pressed',String(value==='dark'));theme.textContent=value==='dark'?'切换浅色':'切换深色';try{localStorage.setItem('delivery-review-theme',value)}catch(_){}}
try{setTheme(localStorage.getItem('delivery-review-theme')==='dark'?'dark':'light')}catch(_){setTheme('light')}
theme.addEventListener('click',()=>setTheme(root.dataset.theme==='dark'?'light':'dark'));
function filter(){const term=search.value.trim().toLocaleLowerCase();let visible=0;document.querySelectorAll('.page-section').forEach(section=>{const rows=[...section.querySelectorAll('[data-search-row]')];rows.forEach(row=>{row.hidden=Boolean(term)&&!row.textContent.toLocaleLowerCase().includes(term);if(!row.hidden)visible++});section.querySelector('.filter-empty').hidden=!term||rows.some(row=>!row.hidden)});document.getElementById('search-status').textContent=term?'当前匹配 '+visible+' 条记录':''}
search.addEventListener('input',filter);document.getElementById('clear').addEventListener('click',()=>{search.value='';filter();search.focus()});
function nav(){const hash=location.hash||'#overview';document.querySelectorAll('.sidebar nav a').forEach(a=>{const active=a.getAttribute('href')===hash;a.classList.toggle('active',active);if(active)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current')})}window.addEventListener('hashchange',nav);nav();
})();
</script></body></html>
